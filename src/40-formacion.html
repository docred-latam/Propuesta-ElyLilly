          <!-- ============ FORMACIÓN ÁGIL · canal de la enfermedad, multiformato ============ -->
          <!-- Una tarea: elegir qué consumir ahora. El título grande es el selector de enfermedad (patrón «título con menú»): no hay segmented (M4).
               Estado local: `menu` (abierto/cerrado), `claves` (orden de las enfermedades), `medios` (tinte suave de la zona media) y helpers de teclado (B8).
               Responsivo por container queries: @3xl (tablet) grilla de 2 y ficha a lo ancho; @6xl (escritorio) grilla de 3 y ficha como columna lateral sticky. -->
          <div x-show="pantalla === 'formacion'" class="relative pb-32 @3xl:pb-16" x-data="{
            menu: false, ficha: false,
            init() {
              const q = new URLSearchParams(location.search);
              this.$watch('ficha', v => { if ('modal' in this) this.modal = v; });
              this.$watch('pantalla', p => { if (p !== 'formacion' && this.ficha) this.ficha = false; });
              if (q.get('menu') === '1') this.menu = true;
              if (q.get('ficha') === '1' && q.get('p') === 'formacion') this.ficha = true;
            },
            claves: ['diabetes', 'mama', 'derma'],
            velos: { diabetes: 'to-diabetes/55', mama: 'to-mama/55', derma: 'to-derma/55' },
            medios: { diabetes: 'from-diabetes/20 via-diabetes/[.06] to-white/0', mama: 'from-mama/20 via-mama/[.06] to-white/0', derma: 'from-derma/20 via-derma/[.06] to-white/0' },
            meta(c) { return [nombreFormato(c.formato), c.duracion, c.fecha].filter(Boolean).join(' · '); },
            get continuar() { return formacion[enfermedad].find(c => c.progreso !== undefined) || null; },
            abrirMenu(foco) { this.menu = true; if (foco) this.$nextTick(() => this.enfocarItem(this.claves.indexOf(enfermedad))); },
            cerrarMenu(volver) { this.menu = false; if (volver) this.$nextTick(() => this.$refs.titulo.focus()); },
            elegir(k) { enfermedad = k; this.cerrarMenu(true); refrescar(); },
            enfocarItem(i) { const items = this.$refs.menu.querySelectorAll('[role=menuitemradio]'); const n = (i + items.length) % items.length; if (items[n]) items[n].focus(); },
            moverItem(e, d) { const items = [...this.$refs.menu.querySelectorAll('[role=menuitemradio]')]; this.enfocarItem(items.indexOf(e.target) + d); },
            moverChip(d) { const i = formatos.findIndex(f => f.id === formato); formato = formatos[(i + d + formatos.length) % formatos.length].id; this.$nextTick(() => { const el = this.$refs.chips.querySelector('[aria-selected=true]'); if (el) { el.focus(); el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } }); },
          }">
              <div class="velable" :class="ficha ? 'is-velado' : ''">
            <div class="mx-auto max-w-[960px] @6xl:max-w-[1200px] px-5 @3xl:px-8 @3xl:pt-4">
              <!-- Título grande = selector de enfermedad -->
              <div class="pt-2 relative">
                <button x-ref="titulo" @click="menu ? cerrarMenu(false) : abrirMenu(false)" @keydown.arrow-down.prevent="abrirMenu(true)" @keydown.escape="cerrarMenu(true)"
                        class="inline-flex items-center gap-1.5 rounded-xl text-left -ml-1 px-1 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1F5FA8]"
                        :aria-expanded="menu ? 'true' : 'false'" aria-haspopup="menu" aria-label="Cambiar de enfermedad">
                  <span class="ios-large-title @3xl:text-[40px]" x-text="enf.nombre"></span>
                  <svg class="h-5 w-5 mt-2 text-ink-2 transition-transform duration-300" :class="menu ? 'rotate-180' : ''" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <p class="mt-1.5 text-[15px] text-ink-2 @3xl:text-[17px]" x-text="'Formación ágil · ' + enf.area"></p>

                <!-- Menú de vidrio (250 ms) -->
                <div x-ref="menu" x-show="menu" x-cloak @click.outside="cerrarMenu(false)" @keydown.escape.prevent="cerrarMenu(true)" role="menu"
                     x-transition:enter="transition duration-[250ms] ease-[cubic-bezier(.32,.72,0,1)]" x-transition:enter-start="opacity-0 -translate-y-1 scale-[.98]" x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                     x-transition:leave="transition duration-200 ease-out" x-transition:leave-start="opacity-100 translate-y-0 scale-100" x-transition:leave-end="opacity-0 -translate-y-1 scale-[.98]"
                     class="glass-strong absolute left-0 top-[52px] @3xl:top-[60px] z-30 w-[280px] origin-top-left rounded-2xl p-1.5 shadow-[0_12px_40px_rgba(0,0,0,.14)]">
                  <template x-for="k in claves" :key="'menu' + k">
                    <button role="menuitemradio" :aria-checked="enfermedad === k ? 'true' : 'false'" :tabindex="enfermedad === k ? 0 : -1"
                            @click="elegir(k)" @keydown.arrow-down.prevent="moverItem($event, 1)" @keydown.arrow-up.prevent="moverItem($event, -1)"
                            class="w-full flex items-center gap-3 rounded-xl px-3 py-2 min-h-[44px] text-left text-[17px] text-ink hover:bg-ink/[.05] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1F5FA8] focus-visible:-outline-offset-2">
                      <span class="w-5 flex justify-center text-ink"><svg x-show="enfermedad === k" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
                      <span class="flex-1"><span x-text="enfermedades[k].nombre"></span><span class="block text-[13px] text-ink-2" x-text="enfermedades[k].area"></span></span>
                    </button>
                  </template>
                </div>
              </div>

              <!-- Tarjeta de marca: lo único comercial de la pantalla. Cada enfermedad va amarrada a su producto (Mounjaro · Verzenio · Ebglyss).
                   Layout de tarjeta con cuerpo visual (referentes que pasó Andrés el 17 de septiembre): el logo hace de titular,
                   los datos van en una fila con iconos y la acción es un botón ancho; el abanico de rayos ocupa la mitad de abajo. -->
              <section class="marca-card mt-6 rounded-[28px] bg-white border border-lilly/20 shadow-glass p-5 pb-7 @3xl:p-6 @3xl:pb-8"
                       :style="'--marca-rayos:url(' + enf.rayos + ')'" :aria-label="'Contenido comercial · ' + enf.producto">
                <span class="marca-rayos" aria-hidden="true"></span>
                <div class="flex items-start justify-between gap-3">
                  <p class="text-[12px] font-semibold uppercase tracking-wide text-lilly">Contenido comercial</p>
                  <img src="img/lilly-firma-roja.png" alt="Lilly" class="h-[15px] w-auto shrink-0 object-contain" loading="eager" decoding="async" />
                </div>

                <!-- El logo es el titular: el lockup ya trae el nombre, repetirlo en texto sobraba. -->
                <img :src="enf.logo" :alt="enf.producto" :style="'--marca-h:' + enf.logoAlto + 'px'"
                     class="marca-logo mt-7 @3xl:mt-9 max-w-[74%] @3xl:max-w-none" loading="eager" decoding="async" />

                <p class="mt-4 max-w-[46ch] text-[15px] @3xl:text-[16px] leading-[1.5] text-ink-2" x-text="enf.descripcion"></p>

                <div class="mt-4 flex flex-wrap items-center gap-x-5 gap-y-2 text-[14px] @3xl:text-[15px] text-ink">
                  <span class="inline-flex items-center gap-2"><i data-lucide="pill" class="h-4 w-4 shrink-0 text-ink-2" stroke-width="1.75"></i><span class="font-medium" x-text="enf.principio"></span></span>
                  <span class="inline-flex items-center gap-2"><i data-lucide="badge-check" class="h-4 w-4 shrink-0 text-ink-2" stroke-width="1.75"></i><span class="font-medium">Aprobado por INVIMA</span></span>
                </div>

                <!-- Las acciones cierran la tarjeta, ya sobre el color. En el teléfono no caben dos
                     cápsulas con texto: la secundaria queda como botón redondo (patrón del referente). -->
                <div class="mt-7 @3xl:mt-8 flex items-center gap-2.5">
                  <button @click="ficha = true" class="ios-btn ios-btn-accent press !h-12 !text-[15px] !px-5 flex-1 @3xl:!flex-none @3xl:!px-7"><i data-lucide="file-badge" class="h-4 w-4"></i>Información para prescribir</button>
                  <button @click="formato = 'pdf'" aria-label="Ver estudios" title="Ver estudios"
                          class="glass press inline-flex h-12 w-12 shrink-0 items-center justify-center rounded-full @3xl:hidden"><i data-lucide="file-text" class="h-5 w-5 text-ink" stroke-width="1.75"></i></button>
                  <button @click="formato = 'pdf'" class="ios-btn-glass glass press !h-12 !text-[15px] !px-6 hidden @3xl:inline-flex">Ver estudios</button>
                </div>
              </section>

              <!-- De aquí en adelante todo es contenido médico -->
              <h2 class="mt-8 text-[22px] font-semibold tracking-tight text-ink">Actualización médica</h2>

              <!-- Seguir viendo: la pieza que quedó a medias (momento 3 tal como lo cuenta la guía) -->
              <template x-for="c in (continuar ? [continuar] : [])" :key="'cont' + enfermedad + c.titulo">
                <section class="mt-4">
                  <h2 class="text-[13px] font-medium text-ink-2 px-1">Seguir viendo</h2>
                  <div class="glass mt-2 rounded-3xl overflow-hidden flex items-stretch">
                    <button @click="abrirPieza(c)" class="relative w-[104px] @3xl:w-[140px] shrink-0 overflow-hidden flex items-center justify-center bg-gradient-to-br press" :class="medios[enfermedad]" :aria-label="'Continuar ' + c.titulo">
                      <img x-show="c.imagen" :src="c.imagen || ''" :style="'object-position:' + (typeof posFoto === 'function' ? posFoto(c.imagen) : 'center')" alt="" loading="eager" decoding="async" class="absolute inset-0 h-full w-full object-cover" />
                      <span x-show="c.imagen" class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent" :class="velos[enfermedad]" aria-hidden="true"></span>
                      <i :data-lucide="iconoFormato(c.formato)" class="h-8 w-8 text-ink/60" :class="c.imagen ? 'hidden' : ''" stroke-width="1.5"></i>
                      <span x-show="c.imagen" class="glass-dark absolute left-2 bottom-2 inline-flex h-7 w-7 items-center justify-center rounded-full"><i :data-lucide="iconoFormato(c.formato)" class="h-3.5 w-3.5" stroke-width="2"></i></span>
                    </button>
                    <div class="flex-1 min-w-0 px-4 py-3 flex flex-col justify-center gap-2">
                      <p class="text-[15px] font-semibold leading-snug text-ink line-clamp-2" x-text="c.titulo"></p>
                      <div>
                        <div class="h-[2px] rounded-full bg-sep overflow-hidden"><div class="h-full rounded-full bg-ink" :style="'width:' + c.progreso + '%'"></div></div>
                        <p class="mt-1.5 text-[12px] text-ink-2" ><span x-text="c.progreso + ' % completado'"></span><span class="hidden @3xl:inline" x-text="' · ' + c.duracion"></span></p>
                      </div>
                    </div>
                    <div class="flex items-center pr-3">
                      <button @click="abrirPieza(c)" class="ios-btn !h-9 !px-4 !text-[15px]">Continuar</button>
                    </div>
                  </div>
                </section>
              </template>

              <!-- Filtro por formato: chips en vidrio, activo en tinta; flechas ← → recorren (B8) -->
              <div x-ref="chips" role="tablist" aria-label="Formato" class="mt-5 -mx-5 px-5 @3xl:mx-0 @3xl:px-0 flex gap-2 overflow-x-auto scroll-hide @3xl:flex-wrap">
                <template x-for="f in formatos" :key="'chip' + f.id">
                  <button role="tab" @click="formato = f.id" @keydown.arrow-right.prevent="moverChip(1)" @keydown.arrow-left.prevent="moverChip(-1)"
                          class="ios-chip glass shrink-0 press aria-selected:!bg-ink aria-selected:!text-white aria-selected:!border-ink aria-selected:shadow-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1F5FA8]"
                          :aria-selected="formato === f.id ? 'true' : 'false'" :tabindex="formato === f.id ? 0 : -1" x-text="f.nombre"></button>
                </template>
              </div>

              <div class="mt-5">
                <!-- Contenidos: el envoltorio se recrea al cambiar formato o enfermedad para que la entrada escalonada vuelva a correr -->
                <div>
                  <template x-for="grupo in [enfermedad + '·' + formato]" :key="grupo">
                    <div class="stagger grid grid-cols-1 gap-4 @3xl:grid-cols-2 @3xl:gap-5 @6xl:grid-cols-3">
                      <template x-for="(c, i) in contenidoFormacion" :key="'fc' + c.titulo">
                        <button @click="abrirPieza(c)" class="glass press w-full h-full rounded-3xl overflow-hidden text-left flex flex-col">
                          <div class="aspect-[16/10] @3xl:aspect-auto @3xl:h-[140px] shrink-0 relative overflow-hidden flex items-center justify-center bg-gradient-to-br" :class="medios[enfermedad]">
                            <!-- Foto (si la pieza la trae) con velo: transparente arriba → tinte de la enfermedad abajo, para que badges e ícono sigan legibles -->
                            <img x-show="c.imagen" :src="c.imagen || ''" :style="'object-position:' + (typeof posFoto === 'function' ? posFoto(c.imagen) : 'center')" alt="" :loading="i === 0 ? 'eager' : 'lazy'" decoding="async" class="absolute inset-0 h-full w-full object-cover" />
                            <span x-show="c.imagen" class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent" :class="velos[enfermedad]" aria-hidden="true"></span>
                            <i :data-lucide="iconoFormato(c.formato)" class="h-10 w-10 text-ink/60" :class="c.imagen ? 'hidden' : ''" stroke-width="1.5"></i>
                            <span x-show="c.imagen" class="glass-dark absolute left-3 bottom-3 inline-flex h-8 w-8 items-center justify-center rounded-full"><i :data-lucide="iconoFormato(c.formato)" class="h-4 w-4" stroke-width="2"></i></span>
                            <span x-show="c.formato === 'live'" class="glass-dark absolute left-3 top-3 inline-flex items-center gap-1.5 rounded-full px-2.5 h-6 text-[11px] font-semibold tracking-wide">
                              <span class="h-1.5 w-1.5 rounded-full bg-lilly animate-pulse"></span>EN VIVO
                            </span>
                            <span x-show="c.duracion" class="glass-dark absolute right-3 bottom-3 rounded-full px-2 h-6 inline-flex items-center text-[12px] font-medium" x-text="c.duracion"></span>
                          </div>
                          <div class="px-4 pt-3 pb-4 flex-1 flex flex-col">
                            <p class="text-[17px] font-semibold leading-snug text-ink" x-text="c.titulo"></p>
                            <p class="mt-1.5 text-[13px] text-ink-2" x-text="meta(c)"></p>
                            <div x-show="c.progreso !== undefined" class="mt-auto pt-3">
                              <div class="h-[2px] rounded-full bg-sep overflow-hidden"><div class="h-full rounded-full bg-ink" :style="'width:' + c.progreso + '%'"></div></div>
                              <p class="mt-1.5 text-[12px] text-ink-2" x-text="c.progreso + ' % completado'"></p>
                            </div>
                          </div>
                        </button>
                      </template>
                      <div x-show="contenidoFormacion.length === 0" class="glass rounded-3xl px-4 py-5 text-center col-span-full">
                        <p class="text-[15px] text-ink-2">Nada en este formato todavía.</p>
                      </div>
                    </div>
                  </template>
                </div>

              </div>
            </div>

            </div><!-- /velable -->
              <!-- Ficha de prescripción (contenido comercial): hoja de vidrio en iPhone, diálogo centrado en tablet y escritorio. Comparte el estado global `modal` para ocultar la tab bar. -->
            <div x-show="ficha" x-cloak class="absolute inset-0 z-40 flex flex-col justify-end @3xl:justify-start @3xl:items-center @3xl:pt-16"
                 x-transition:enter="transition-opacity duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
                 x-transition:leave="transition-opacity duration-300 delay-100" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
              <div class="absolute inset-0 velo" aria-hidden="true" @click="ficha = false"></div>
              <div x-show="ficha" role="dialog" aria-modal="true" :aria-label="'Información para prescribir de ' + enf.producto" @keydown.escape.window="ficha = false"
                   x-transition:enter="transition-transform duration-[420ms] ease-[cubic-bezier(.32,.72,0,1)]" x-transition:enter-start="translate-y-full @3xl:translate-y-4" x-transition:enter-end="translate-y-0"
                   x-transition:leave="transition-transform duration-300 ease-[cubic-bezier(.32,.72,0,1)]" x-transition:leave-start="translate-y-0" x-transition:leave-end="translate-y-full @3xl:translate-y-4"
                   class="glass-strong ios-sheet sticky bottom-0 px-5 pb-8 shadow-[0_-12px_40px_rgba(0,0,0,.12)] @3xl:static @3xl:before:hidden @3xl:w-[480px] @3xl:!rounded-[28px] @3xl:p-6 @3xl:shadow-[0_24px_64px_rgba(0,0,0,.18)]">
                <p class="text-[12px] font-semibold uppercase tracking-wide text-lilly">Contenido comercial</p>
                <h2 class="sr-only" x-text="enf.producto"></h2>
                <img :src="enf.logo" :alt="enf.producto" :style="'--marca-h:' + enf.logoAlto + 'px'"
                     class="marca-logo mt-2.5 max-w-[62%]" loading="eager" decoding="async" />
                <p class="mt-2.5 text-[15px] text-ink-2"><span x-text="enf.principio"></span> · Lilly · <span x-text="enf.nombre"></span></p>
                <div class="ios-list glass mt-4">
                  <div class="ios-row">
                    <span class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-[10px] bg-lilly-soft text-lilly"><i data-lucide="badge-check" class="h-5 w-5"></i></span>
                    <span class="flex-1 min-w-0"><span class="block text-[15px] font-medium text-ink">Aprobado por INVIMA</span><span class="block text-[13px] text-ink-2">Registro sanitario vigente en Colombia</span></span>
                  </div>
                  <div class="ios-row">
                    <span class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-[10px] bg-ink/[.06] text-ink"><i data-lucide="file-text" class="h-5 w-5"></i></span>
                    <span class="flex-1 min-w-0"><span class="block text-[15px] font-medium text-ink">Ficha técnica</span><span class="block text-[13px] text-ink-2">PDF · 24 páginas · Actualizada ago 2026</span></span>
                  </div>
                </div>
                <p class="mt-3 px-1 text-[12px] text-ink-3">Material dirigido exclusivamente a profesionales de la salud.</p>
                <div class="mt-4 flex gap-3">
                  <button class="ios-btn ios-btn-accent flex-1 press" @click="ficha = false"><i data-lucide="download" class="h-5 w-5"></i>Descargar</button>
                  <button class="ios-btn-glass glass press" @click="ficha = false">Cerrar</button>
                </div>
              </div>
            </div>
          </div>
