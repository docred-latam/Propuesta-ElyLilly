          <!-- ============ INICIO: una sola tarea, elegir por dónde entrar. @3xl = tablet, @6xl = escritorio (container queries) ============ -->
          <div x-show="pantalla === 'inicio' || (dispositivo === 'iphone' && pantalla === 'tema')" :class="{ 'inicio-enter': inicioPrimeraVez }" @animationend.self="inicioPrimeraVez = false" class="px-5 pb-[200px] @3xl:px-10 @3xl:pt-6 @3xl:pb-16 @6xl:px-14 @6xl:pt-10 @6xl:max-w-[1180px] @6xl:mx-auto @6xl:grid @6xl:grid-cols-2 @6xl:gap-12 @6xl:items-start">
            <div class="stagger @3xl:max-w-[720px]">
              <div class="pt-2 flex items-start justify-between">
                <h1 class="ios-large-title" x-text="saludo + ', Dr.\u00A0Óscar'"></h1>
                <span class="mt-2 shrink-0 whitespace-nowrap text-[13px] font-semibold tracking-tight @3xl:hidden"><span class="lilly-firma h-[15px] w-[40px] text-lilly" role="img" aria-label="Lilly"></span> <span class="text-ink-3">360</span></span>
              </div>

              <label x-show="dispositivo !== 'iphone'" class="glass ios-search mt-5">
                <i data-lucide="search" class="h-5 w-5"></i><span>Guías, algoritmos, webinars</span>
              </label>

              <!-- Búsqueda rápida (en iPhone vive en la hoja inferior) -->
              <section x-show="dispositivo !== 'iphone'" class="mt-8">
                <h2 class="text-[22px] font-semibold tracking-tight text-ink">Búsqueda rápida</h2>
                <p class="mt-0.5 text-[13px] text-ink-2">Resuelve la duda de tu paciente en segundos</p>
                <div class="mt-3 grid grid-cols-3 gap-3 @3xl:gap-4">
                  <template x-for="(e, k) in enfermedades" :key="k">
                    <button @click="abrirTema(k)" class="glass press rounded-3xl p-3.5 text-left flex flex-col gap-3 min-h-[124px] @3xl:min-h-[140px] @3xl:p-5 @3xl:justify-between">
                      <span class="glass-icon @3xl:!h-12 @3xl:!w-12"><i :data-lucide="e.icono" class="h-5 w-5 @3xl:h-6 @3xl:w-6"></i></span>
                      <span class="text-[14px] font-semibold leading-tight text-ink @3xl:text-[16px]" x-text="e.nombre"></span>
                    </button>
                  </template>
                </div>
              </section>
            </div>

            <!-- Formación ágil -->
            <section class="mt-8 stagger @6xl:mt-0 @6xl:pt-2">
              <h2 class="text-[22px] font-semibold tracking-tight text-ink">Formación ágil</h2>
              <p class="mt-0.5 text-[13px] text-ink-2">Para el almuerzo, la noche o la discusión clínica</p>
              <div class="mt-3 space-y-3 @3xl:grid @3xl:grid-cols-3 @3xl:gap-4 @3xl:space-y-0 @6xl:grid-cols-1">
                <template x-for="(e, k) in enfermedades" :key="'f' + k">
                  <button @click="abrirFormacion(k)" class="tint-card foto-card press relative w-full rounded-3xl p-5 text-left flex items-end min-h-[148px] @3xl:min-h-[188px] @6xl:min-h-[160px]" :data-tinte="k">
                    <img :src="e.hero" :alt="'Formación ágil · ' + e.nombre" loading="lazy" decoding="async" :style="'object-position:' + posFoto(e.hero)" />
                    <div class="foto-texto min-w-0 pr-2">
                      <p class="text-[13px] text-white/80" x-text="e.area"></p>
                      <p class="mt-1 text-[20px] font-semibold leading-tight tracking-tight text-white" x-text="e.nombre"></p>
                      <p class="mt-1 text-[15px] text-white/85 leading-snug" x-text="e.formacionSub"></p>
                    </div>
                    <span x-show="enVivoHoy(k)" class="glass-dark absolute top-4 right-4 inline-flex items-center gap-1.5 rounded-full px-3 h-7 text-[12px] font-semibold"><span class="h-1.5 w-1.5 rounded-full bg-lilly"></span>En vivo hoy</span>
                  </button>
                </template>
              </div>
            </section>
          </div>
